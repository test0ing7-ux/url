<!DOCTYPE html>
<html>
<head>
    <title>Mock Test Environment</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .question { margin-bottom: 20px; font-size: 1.1em; }
        .options { list-style: none; padding: 0; }
        .options li { margin-bottom: 10px; }
        .options label { cursor: pointer; display: flex; align-items: center; }
        .options input { margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mock Test Environment</h1>
        <p>This is a fake test environment to verify that the AI Solver script is injecting and working correctly.</p>
        <hr>
        <div class="question">
            <strong>Q1. Which of the following is a dynamically typed language?</strong>
        </div>
        <ul class="options">
            <li><label><input type="radio" name="q1"> Java</label></li>
            <li><label><input type="radio" name="q1"> C++</label></li>
            <li><label><input type="radio" name="q1"> Python</label></li>
            <li><label><input type="radio" name="q1"> C#</label></li>
        </ul>
        <button style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Submit Answer</button>
    </div>
    <script>
        // Fake some app data that the solver might look for
        window.isTestEnvironment = true;
    </script>
</body>
</html>
