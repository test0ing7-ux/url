<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>edvu - Learning Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{text-align:center;max-width:520px;width:100%;padding:20px}
h1{font-size:32px;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,#6366f1,#8b5cf6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:rgba(255,255,255,.4);font-size:13px;margin-bottom:32px}
.input-wrap{display:flex;gap:0;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.1);transition:border-color .2s}
.input-wrap:focus-within{border-color:#6366f1}
input{flex:1;padding:14px 16px;background:rgba(255,255,255,.05);border:none;color:#fff;font-size:15px;outline:none}
input::placeholder{color:rgba(255,255,255,.25)}
button{padding:14px 24px;background:linear-gradient(135deg,#6366f1,#7c3aed);border:none;color:#fff;font-weight:600;cursor:pointer;font-size:15px;transition:opacity .2s}
button:hover{opacity:.85}
.hint{margin-top:16px;color:rgba(255,255,255,.3);font-size:12px}
.error{color:#ef4444;margin-top:12px;font-size:13px;display:none}
</style>
</head>
<body>
<div class="container">
<h1>edvu</h1>
<p class="sub">Universal Learning Portal</p>
<form id="form">
<div class="input-wrap">
<input type="text" id="url" placeholder="https://example.com/page" autocomplete="off" autofocus>
<button type="submit">Go</button>
</div>
</form>
<p class="hint">Paste any URL to access through the portal</p>
<p class="error" id="err"></p>
</div>
<script>
document.getElementById('form').addEventListener('submit', function(e) {
    e.preventDefault();
    var errEl = document.getElementById('err');
    errEl.style.display = 'none';
    var url = document.getElementById('url').value.trim();
    if (!url) return;
    if (url.indexOf('://') === -1) url = 'https://' + url;
    try {
        var parsed = new URL(url);
        var targetHost = parsed.hostname;
        var encodedHost = targetHost.split('.').join('-');
        var targetPath = parsed.pathname + parsed.search + parsed.hash;
        // Get our proxy domain suffix (everything after the first dot, or the full hostname if bare)
        var proxyDomain = window.location.hostname;
        // Build the proxied URL: encodedHost.proxyDomain/path
        var proxiedUrl = window.location.protocol + '//' + encodedHost + '.' + proxyDomain + targetPath;
        window.location.href = proxiedUrl;
    } catch(ex) {
        errEl.textContent = 'Invalid URL — please include https://';
        errEl.style.display = 'block';
    }
});
</script>
</body>
</html>
